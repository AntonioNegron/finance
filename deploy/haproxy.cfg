# The finance forwarder: two plain TCP forwards, nothing else. install.sh copies
# this to /opt/finance/forwarder/haproxy.cfg (root-owned); the updater never
# changes it. No log lines: there's no "log" setting, so HAProxy logs nothing.

global
    maxconn 200

defaults
    mode tcp
    timeout connect 5s
    timeout client 10m
    timeout server 10m

# Docker's own DNS, so the app's address is looked up again after the updater
# recreates it.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

# Caddy -> the app (published on the Docker bridge address only, see compose.yml)
frontend from_caddy
    bind :8080
    default_backend app

backend app
    server app app:8080 resolvers docker init-addr last,libc,none

# The app -> Actual on the OptiPlex's port 5006 (not published)
frontend from_app
    bind :5006
    default_backend actual

backend actual
    server actual host.docker.internal:5006 init-addr last,libc,none
